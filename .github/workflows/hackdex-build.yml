name: Build HackDex Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - windows-desktop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pywebview

      - name: Run regression tests
        shell: pwsh
        run: |
          Set-Location app
          python -m unittest test_desktop_storage test_platform_paths test_matcher_identity

      - name: Build Windows application
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\desktop\build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\windows\installer\build-installer.ps1

      - name: Validate Windows payload
        shell: pwsh
        run: |
          $Root = "windows\dist\HackDex Manager"
          $Setup = "windows\installer\output\HackDex Manager Setup.exe"

          if (-not (Test-Path "$Root\HackDex Manager.exe")) {
            throw "HackDex Manager.exe missing."
          }

          if (-not (Test-Path $Setup)) {
            throw "HackDex Manager Setup.exe missing."
          }

          foreach ($Name in @("Data","Staging","Logs","Backups",".preview-backups")) {
            if (Test-Path (Join-Path $Root $Name)) {
              throw "Runtime folder leaked into packaged app: $Name"
            }
          }

          if (-not (Test-Path "$Root\_internal\app\static\hackdex-logo.png")) {
            throw "Canonical logo missing from frozen Windows app."
          }

          if (-not (Test-Path "$Root\_internal\app\static\favicon.ico")) {
            throw "Favicon missing from frozen Windows app."
          }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $Exe = "windows\dist\HackDex Manager\HackDex Manager.exe"
          $Setup = "windows\installer\output\HackDex Manager Setup.exe"

          $ExeHash = (Get-FileHash $Exe -Algorithm SHA256).Hash.ToLower()
          $SetupHash = (Get-FileHash $Setup -Algorithm SHA256).Hash.ToLower()

          @(
            "$ExeHash  HackDex Manager.exe"
            "$SetupHash  HackDex Manager Setup.exe"
          ) | Set-Content -Path "windows\installer\output\SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HackDex-Manager-Windows
          path: |
            windows/installer/output/HackDex Manager Setup.exe
            windows/installer/output/SHA256SUMS.txt
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared branding assets
        shell: bash
        run: |
          test -f app/static/hackdex-logo.png
          test -f app/static/favicon.ico
          test -f docs/assets/hackdex-manager-logo.png
          grep -q "/static/hackdex-logo.png" app/static/hackdex-ui.css
          grep -q "/static/favicon.ico" app/templates/index.html

      - name: Build Docker image
        run: docker build --tag hackdex-manager:ci .

      - name: Verify image starts
        shell: bash
        run: |
          cid="$(docker run -d -p 127.0.0.1::8095 hackdex-manager:ci)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          host_port="$(docker port "$cid" 8095/tcp | head -n1 | awk -F: '{print $NF}')"

          for i in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${host_port}/" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready."
          exit 1
