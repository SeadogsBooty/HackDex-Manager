services:
  hackdex-manager:
    image: ${HACKDEX_IMAGE:-ghcr.io/seadogsbooty/hackdex-manager:1.0.0}
    restart: unless-stopped

    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "${HACKDEX_PORT:-8095}:8080"

    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      - ${HACKDEX_DATA_PATH:-./data}:/data:rw
      - ${HACKDEX_STAGING_PATH:-./staging}:/staging:rw
      - ${ROM_PATH:-./roms}:/roms:ro
      - ${HACKDEX_HACKS_PATH:-./hacks}:/hacks:rw

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
